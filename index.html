<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

<body>
  <button class="theme-toggle" id="themeToggle" aria-label="切换深色模式">
    <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>

  <div class="page">
    <header class="header">
      <div class="avatar">A</div>

      <p class="bio">Obsidian 插件开发者，专注数学与学术写作工具</p>
      <div class="social-links">
        <a href="https://github.com/AlbusGuo" target="_blank" rel="noopener" class="social-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
          GitHub
        </a>
      </div>
    </header>

    <section class="projects">
      <h2 class="section-label">作品</h2>
      <div class="project-list">
        <a href="/mathcraft/" class="project-card">
          <div class="project-icon" style="background:#ede9fe;color:#7c3aed">M</div>
          <div class="project-body">
            <h3>MathCraft</h3>
            <p>Obsidian 数学增强插件 — 定理编号 · 公式编号 · TikZ 渲染 · GeoGebra 集成</p>
          </div>
          <span class="project-arrow">→</span>
        </a>
        <a href="/super-daily-notes/" class="project-card">
          <div class="project-icon" style="background:#ccfbf1;color:#0d9488">S</div>
          <div class="project-body">
            <h3>Super Daily Notes</h3>
            <p>Obsidian 日程管理增强插件 — 日程规划 · 事件管理 · 习惯打卡 · 悬浮计时器</p>
          </div>
          <span class="project-arrow">→</span>
        </a>
      </div>
    </section>
  </div>

  <footer class="footer">
    <p>© 2025 – 2026 Albus</p>
  </footer>

  <script>
  (function(){
    var html = document.documentElement;
    var btn = document.getElementById('themeToggle');
    var stored = localStorage.getItem('theme');
    if (stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme:dark)').matches)) {
      html.classList.add('dark');
    }
    if (btn) btn.addEventListener('click', function(){
      html.classList.toggle('dark');
      localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
    });
  })();
  </script>
</body>
</html>
